<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title><!--TITLE--></title>
  <meta name="description" content="<!--DESCRIPTION-->">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Inter:wght@400;600;700&family=Fraunces:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/store.css">
  <!--THEME-CSS-->
  <link rel="manifest" href="/store.webmanifest">
  <link rel="icon" href="/ops/icons/icon-192.png">
</head>
<body>

<!--ICONS-->

<a class="skip-link" href="#page-body">Skip to content</a>

<div class="announce" id="announce">
  <div class="announce-track" id="announce-track"><!--ANNOUNCE--></div>
</div>

<header class="topbar">
  <button class="icon-btn" id="menu-btn" aria-label="Menu">
    <svg class="ico" aria-hidden="true"><use href="#i-menu"/></svg></button>
  <a class="brand" href="/"><!--BRAND--></a>
  <nav class="top-links"><!--NAV--></nav>
  <div class="top-actions">
    <select id="locale-select" class="mini-select" hidden aria-label="Language"></select>
    <select id="currency-select" class="mini-select" hidden aria-label="Currency"></select>
    <button class="icon-btn" id="account-btn" title="My account" aria-label="My account">
      <svg class="ico" aria-hidden="true"><use href="#i-user"/></svg></button>
    <button class="icon-btn" id="track-btn" title="Track my order" aria-label="Track my order">
      <svg class="ico" aria-hidden="true"><use href="#i-box"/></svg></button>
    <button class="icon-btn" id="support-btn" title="Support" aria-label="Support">
      <svg class="ico" aria-hidden="true"><use href="#i-chat"/></svg></button>
    <button class="cart-btn" id="cart-btn" aria-label="Open cart">
      <svg class="ico ico-sm" aria-hidden="true"><use href="#i-cart"/></svg>
      <span class="cart-count" id="cart-count">0</span></button>
  </div>
</header>

<aside class="side-menu" id="side-menu" aria-label="Main menu">
  <div class="side-head">
    <b>Menu</b><button class="icon-btn" id="menu-close" aria-label="Close menu">
      <svg class="ico" aria-hidden="true"><use href="#i-close"/></svg></button>
  </div>
  <div id="side-collections"></div>
  <div class="side-foot">
    <a href="#rewards"><svg class="ico" aria-hidden="true"><use href="#i-gift"/></svg> Rewards</a>
    <a href="#" id="side-track"><svg class="ico" aria-hidden="true"><use href="#i-box"/></svg> Track order</a>
    <a href="/admin" class="dim-link">Team sign-in →</a>
  </div>
</aside>
<div class="scrim" id="scrim"></div>

<section class="promo-strip" id="promo-strip" hidden>
  <div class="promo-inner">
    <span class="promo-flame"><svg class="ico" aria-hidden="true"><use href="#i-clock"/></svg></span>
    <div><b id="promo-name"></b><span class="dim" id="promo-body"></span></div>
    <span class="countdown" id="promo-countdown"></span>
  </div>
</section>

<main id="page-body">
<!--SECTIONS-->
</main>

<footer class="footer">
  <a class="brand" href="/"><!--BRAND--></a>
  <div class="foot-links"><!--FOOTNAV-->
    <a href="#" id="foot-track">Track order</a>
    <a href="#" id="foot-support">Support</a>
    <a href="/admin" class="dim-link">Store admin</a>
  </div>
  <p class="dim"><!--FOOTER--></p>
</footer>

<!-- cart drawer -->
<aside class="cart-drawer" id="cart-drawer" aria-label="Your cart">
  <div class="side-head"><b>Your cart</b>
    <button class="icon-btn" id="cart-close" aria-label="Close cart">
      <svg class="ico" aria-hidden="true"><use href="#i-close"/></svg></button></div>
  <div class="ship-meter" id="ship-meter" hidden>
    <p id="ship-meter-msg"></p>
    <div class="bar"><div class="fill" id="ship-meter-fill" style="width:0"></div></div>
  </div>
  <div class="cart-items" id="cart-items"></div>
  <div id="cart-upsell"></div>
  <div class="cart-foot">
    <div class="cart-discount">
      <input id="discount-input" placeholder="Discount code" aria-label="Discount code">
      <button class="btn-pill ghost sm" id="discount-apply">Apply</button>
      <span class="dim" id="discount-msg"></span>
    </div>
    <div class="cart-discount">
      <input id="gift-input" placeholder="Gift card code" aria-label="Gift card code">
      <button class="btn-pill ghost sm" id="gift-apply">Apply</button>
      <span class="dim" id="gift-msg"></span>
    </div>
    <div class="cart-total" id="cart-total"></div>
    <button class="btn-pill primary" id="checkout-btn">Checkout
      <svg class="ico ico-sm" aria-hidden="true"><use href="#i-arrow"/></svg></button>
  </div>
</aside>

<!-- accessibility preferences -->
<button class="a11y-fab" id="a11y-fab" aria-label="Accessibility options"
        aria-expanded="false" aria-controls="a11y-panel">
  <svg class="ico" aria-hidden="true"><use href="#i-a11y"/></svg></button>
<div class="a11y-panel" id="a11y-panel" role="dialog" aria-label="Accessibility options">
  <h4>Accessibility</h4>
  <p class="dim" style="font-size:13px;margin-bottom:6px">Saved on this device.</p>
  <div class="a11y-row"><span>Text size</span>
    <span class="a11y-seg" id="a11y-text" role="group" aria-label="Text size">
      <button data-size="" class="on">A</button>
      <button data-size="lg">A+</button>
      <button data-size="xl">A++</button>
    </span></div>
  <div class="a11y-row"><span id="a11y-contrast-lbl">High contrast</span>
    <button class="a11y-toggle" id="a11y-contrast" role="switch"
            aria-checked="false" aria-labelledby="a11y-contrast-lbl"></button></div>
  <div class="a11y-row"><span id="a11y-motion-lbl">Reduce motion</span>
    <button class="a11y-toggle" id="a11y-motion" role="switch"
            aria-checked="false" aria-labelledby="a11y-motion-lbl"></button></div>
  <div class="a11y-row"><span id="a11y-links-lbl">Underline links</span>
    <button class="a11y-toggle" id="a11y-links" role="switch"
            aria-checked="false" aria-labelledby="a11y-links-lbl"></button></div>
  <button class="btn-pill ghost sm wide" id="a11y-reset"
          style="margin-top:12px">Reset</button>
</div>

<!-- modals -->
<div class="modal" id="modal">
  <div class="modal-card" id="modal-card"></div>
</div>

<!--I18N-->
<script src="/store.js"></script>
</body>
</html>
