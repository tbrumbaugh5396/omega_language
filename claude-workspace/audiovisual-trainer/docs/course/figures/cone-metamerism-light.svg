<svg xmlns="http://www.w3.org/2000/svg" width="680" height="495" viewBox="0 0 680 495" role="img">
<title>Cone sensitivity curves and metamerism</title>
<desc>Top panel shows the three human cone sensitivity curves, S, M and L, broad and heavily overlapping across roughly 400 to 700 nanometres. Bottom panel shows two completely different spectra, one broad hump and one pair of narrow green and red spikes, each producing an identical triple of S, M and L cone responses.</desc>
<style>
text { font-family: DejaVu Sans, Helvetica Neue, Helvetica, Arial, sans-serif; }
.h { font-size: 16px; font-weight: 500; fill: #2C2C2A; }
.t { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.s { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
</style>
<rect width="680" height="495" fill="#FFFFFF"/>
<text class="h" x="340" y="32" text-anchor="middle">Cone response: three numbers from a whole spectrum</text>
<line x1="60" y1="210" x2="638" y2="210" stroke="#8B8A83" stroke-width="0.9"/>
<path d="M70,210 Q79,126 200,210" fill="none" stroke="#2E7BC4" stroke-width="1.8"/>
<path d="M180,210 Q282,94 520,210" fill="none" stroke="#5A8C1E" stroke-width="1.8"/>
<path d="M210,210 Q342,86 590,210" fill="none" stroke="#C8502A" stroke-width="1.8"/>
<text class="t" x="107" y="158" text-anchor="middle" fill="#2E7BC4">S</text>
<text class="t" x="300" y="140" text-anchor="middle" fill="#5A8C1E">M</text>
<text class="t" x="390" y="136" text-anchor="middle" fill="#C8502A">L</text>
<text class="s" x="70" y="228" text-anchor="middle">400 nm</text>
<text class="s" x="620" y="228" text-anchor="middle">700 nm</text>
<line x1="65" y1="330" x2="255" y2="330" stroke="#8B8A83" stroke-width="0.9"/>
<line x1="270" y1="305" x2="395" y2="305" stroke="#8B8A83" stroke-width="1.3" stroke-linecap="round"/>
<path d="M389.1,308.7 L395,305 L389.1,301.3" fill="none" stroke="#8B8A83" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="420" y="312" width="30" height="18" rx="2" fill="#2E7BC4" fill-opacity="0.55"/>
<rect x="470" y="278" width="30" height="52" rx="2" fill="#5A8C1E" fill-opacity="0.55"/>
<rect x="520" y="268" width="30" height="62" rx="2" fill="#C8502A" fill-opacity="0.55"/>
<text class="s" x="435" y="345" text-anchor="middle">S</text>
<text class="s" x="485" y="345" text-anchor="middle">M</text>
<text class="s" x="535" y="345" text-anchor="middle">L</text>
<line x1="65" y1="430" x2="255" y2="430" stroke="#8B8A83" stroke-width="0.9"/>
<line x1="270" y1="405" x2="395" y2="405" stroke="#8B8A83" stroke-width="1.3" stroke-linecap="round"/>
<path d="M389.1,408.7 L395,405 L389.1,401.3" fill="none" stroke="#8B8A83" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="420" y="412" width="30" height="18" rx="2" fill="#2E7BC4" fill-opacity="0.55"/>
<rect x="470" y="378" width="30" height="52" rx="2" fill="#5A8C1E" fill-opacity="0.55"/>
<rect x="520" y="368" width="30" height="62" rx="2" fill="#C8502A" fill-opacity="0.55"/>
<text class="s" x="435" y="445" text-anchor="middle">S</text>
<text class="s" x="485" y="445" text-anchor="middle">M</text>
<text class="s" x="535" y="445" text-anchor="middle">L</text>
<path d="M90,330 Q170,230 250,330 Z" fill="#8B8A83" fill-opacity="0.20" stroke="#8B8A83" stroke-width="1.4"/>
<rect x="149" y="385" width="10" height="45" fill="#5A8C1E" fill-opacity="0.75"/>
<rect x="197" y="375" width="10" height="55" fill="#C8502A" fill-opacity="0.75"/>
<text class="s" x="340" y="472" text-anchor="middle">Different spectra, identical response — a metamer</text>
</svg>
