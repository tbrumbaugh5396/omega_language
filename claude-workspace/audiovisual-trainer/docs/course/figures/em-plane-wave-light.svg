<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450" role="img">
<title>Electromagnetic plane wave: graph versus field in space</title>
<desc>Top panel shows the familiar sine curve as a graph of electric field strength against position. Bottom panel shows the same wave as parallel sheets in space, each sheet carrying one uniform field vector that flips direction every half wavelength.</desc>
