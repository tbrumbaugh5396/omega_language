name: business-control CI

# The smoke suite is the contract: 1,891 script-style checks in three
# parts run in parallel, printing "all N checks passed" or failing loudly.
# It runs on every push and PR that touches business-control.

on:
  push:
    branches: [main]
    paths: ["claude-workspace/business-control/**",
            ".github/workflows/ci.yml"]
  pull_request:
    paths: ["claude-workspace/business-control/**",
            ".github/workflows/ci.yml"]

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: claude-workspace/business-control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: claude-workspace/business-control/requirements.txt
      - name: install
        run: pip install -r requirements.txt
      - name: syntax gate (fast fail)
        run: |
          python -m compileall -q src tests scripts
          command -v node >/dev/null && for f in src/erp/frontend/app/*.js \
            src/storefront/frontend/*.js; do node --check "$f"; done
      - name: smoke suite (three parts, parallel)
        run: PYTHONPATH=src python tests/test_smoke.py
